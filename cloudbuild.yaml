steps:
  # 1. Install dependencies
  - name: 'node:24'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Run unit tests
  - name: 'node:24'
    entrypoint: 'npm'
    args: ['test']

  # 3. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/schada:$COMMIT_SHA', '.']

  # 4. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/schada:$COMMIT_SHA']

  # 5. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'schada-game'
      - '--image'
      - 'gcr.io/$PROJECT_ID/schada:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/schada:$COMMIT_SHA'
