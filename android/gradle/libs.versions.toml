[versions]
activity = "1.13.0"
appcompat = "1.8.0"
coordinatorlayout = "1.3.0"
cordovaAndroid = "15.1.0"
core = "1.19.1"
coreSplashscreen = "1.2.0"
espressoCore = "3.7.0"
fragment = "1.9.1"
googleServices = "4.5.0"
gradle = "9.4.1"
gradleToolchainsFoojayResolverConvention = "1.0.0"
json = "20260814"
junit = "1.3.0"
junitVersion = "4.13.2"
compileSdk = "37"
mockitoCore = "5.24.0"
webkit = "1.17.1"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
cordova-framework = { group = "org.apache.cordova", name = "framework", version.ref = "cordovaAndroid" }
google-services = { group = "com.google.gms", name = "google-services", version.ref = "googleServices" }
gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }
json = { module = "org.json:json", version.ref = "json" }
junit = { group = "junit", name = "junit", version.ref = "junitVersion" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }

[plugins]
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "gradleToolchainsFoojayResolverConvention" }
