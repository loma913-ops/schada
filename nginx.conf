server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Immutable hashed Vite assets (JS, CSS, chunk files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Service Worker, registration scripts, manifest, and version metadata MUST NEVER BE CACHED
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 3. Static icons, audio assets, and favicon (revalidate with ETag)
    location ~* \.(mp3|png|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # 4. SPA routing: index.html entry point must NEVER be cached by browsers
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
